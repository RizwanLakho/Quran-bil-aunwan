<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Create Topic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Test Create Topic API</h1>

    <div id="tokenStatus"></div>

    <button onclick="testCreateTopic()">Test Create Topic</button>
    <button onclick="checkToken()">Check Token</button>

    <div id="result"></div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        function checkToken() {
            const token = localStorage.getItem('auth_token');
            const statusDiv = document.getElementById('tokenStatus');

            if (!token) {
                statusDiv.innerHTML = '<div class="status error"><strong>❌ NO TOKEN FOUND</strong><p>You need to login first at /login</p></div>';
            } else {
                statusDiv.innerHTML = `<div class="status success"><strong>✅ TOKEN FOUND</strong><p>${token.substring(0, 50)}...</p></div>`;
            }
        }

        async function testCreateTopic() {
            const resultDiv = document.getElementById('result');
            const token = localStorage.getItem('auth_token');

            if (!token) {
                resultDiv.innerHTML = '<div class="status error"><strong>❌ NO TOKEN</strong><p>Please login first!</p></div>';
                return;
            }

            resultDiv.innerHTML = '<div class="status info">Testing...</div>';

            const testData = {
                name: "Test Topic" + Date.now(),
                alternative_name: "Test Alt Name",
                description: "This is a test",
                status: "draft",
                ayahs: [],
                hadiths: []
            };

            console.log('🔍 Request URL:', `${API_BASE}/topics`);
            console.log('🔍 Request Data:', testData);
            console.log('🔍 Token:', token.substring(0, 30) + '...');

            try {
                const response = await fetch(`${API_BASE}/topics`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(testData)
                });

                console.log('✅ Response Status:', response.status);
                const data = await response.json();
                console.log('✅ Response Data:', data);

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status success">
                            <strong>✅ SUCCESS!</strong>
                            <p>Topic created successfully</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                            <p><strong>Your AddTopic page should work now!</strong></p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            <strong>❌ ERROR ${response.status}</strong>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                            ${response.status === 401 ? '<p>Token is invalid/expired. Please login again.</p>' : ''}
                            ${response.status === 403 ? '<p>Account not verified.</p>' : ''}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Network Error:', error);
                resultDiv.innerHTML = `
                    <div class="status error">
                        <strong>❌ NETWORK ERROR</strong>
                        <p>${error.message}</p>
                        <p><strong>Possible causes:</strong></p>
                        <ul>
                            <li>Backend not running on port 8000</li>
                            <li>CORS misconfigured</li>
                            <li>Browser blocking request</li>
                        </ul>
                        <p><strong>Check browser console for details</strong></p>
                    </div>
                `;
            }
        }

        // Auto-check token on load
        window.onload = checkToken;
    </script>
</body>
</html>
