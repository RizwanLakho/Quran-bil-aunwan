<!DOCTYPE html>
<html>
<head>
    <title>Simple API Test</title>
</head>
<body>
    <h1>Direct API Test</h1>
    <button onclick="testAPI()">Click to Test API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            const token = localStorage.getItem('auth_token');

            if (!token) {
                resultDiv.innerHTML = '<p style="color:red">NO TOKEN! Login first at /login</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Testing...</p>';

            try {
                console.log('Making request to: http://localhost:8000/api/topics');
                console.log('Token:', token.substring(0, 30) + '...');

                const response = await fetch('http://localhost:8000/api/topics', {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        name: 'Test Topic ' + Date.now(),
                        alternative_name: 'Test Alt',
                        description: 'Test',
                        status: 'draft',
                        ayahs: [],
                        hadiths: []
                    })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    resultDiv.innerHTML = '<p style="color:green">SUCCESS! Topic created!</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<p style="color:orange">Server Error: ' + response.status + '</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.innerHTML = '<p style="color:red">NETWORK ERROR: ' + error.message + '</p><p>Check console (F12) for details</p>';
            }
        }
    </script>
</body>
</html>
